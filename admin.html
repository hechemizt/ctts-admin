 class="mt-6 flex gap-2"><a href="index.html?admin=secret" class="bg-black text-white px-4 py-2 rounded-full text-xs">Dashboard</a><button onclick="localStorage.clear();location.reload()" class="bg-red-50 text-red-600 px-4 py-2 rounded-full text-xs">Logout</button></div></div><script>const firebaseConfig={apiKey:"AIzaSyDTDSNf_na7I1NumCurymU_YTvEnGC6FtU",authDomain:"ctts-rogom-cc1e0.firebaseapp.com",projectId:"ctts-rogom-cc1e0",storageBucket:"ctts-rogom-cc1e0.firebasestorage.app",messagingSenderId:"279143059942",appId:"1:279143059942:web:cc80e0c89b01dee9fd4627"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();function login(){let u=document.getElementById('u').value.toLowerCase().trim(),p=document.getElementById('p').value.trim();let admins={adei:'0764316177',admin:'0745824005'};if(admins[u]&&admins[u]==p){localStorage.setItem('ctts_admin',u);document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');}}function create(){let user=document.getElementById('su').value.toLowerCase().trim(),name=document.getElementById('sn').value.trim(),phone=document.getElementById('sp').value.trim();if(!user||!name||!phone)return alert('Fill');let pin='1234';db.collection('staff_invites').where('username','==',user).get().then(s=>{if(!s.empty)return alert('Exists');db.collection('staff_invites').add({username:user,name:name,phone:phone,pin:pin,mustChange:true,used:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{let link='https://hechemizt.github.io/ctts-admin/staff-invite.html?user='+user+'&pin='+pin;document.getElementById('res').innerHTML=`✅ ${user} PIN ${pin}<br>${link}<br><a href="https://wa.me/${phone.replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Username:'+user+' PIN:'+pin+' Link:'+link)}" target="_blank" style="background:green;color:white;padding:8px 12px;border-radius:20px;display:inline-block;margin-top:8px">WhatsApp</a>`;});});}</script></body></html>
