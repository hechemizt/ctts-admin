a href="tel:${o.phone}" class="bg-gray-100 p-1 rounded text-[9px] text-center"><i class="fa-solid fa-phone"></i></a><a href="https://wa.me/${o.phone}" target="_blank" class="bg-green-100 p-1 rounded text-[9px] text-center">WA</a><a href="sms:${o.phone}" class="bg-blue-100 p-1 rounded text-[9px] text-center">SMS</a></div><button onclick="printReceipt('${id}')" class="w-full bg-blue-500 text-white p-1 rounded text-[9px] mt-1">Receipt</button>`:''}</td></tr>`;});if(document.getElementById('dOrders')){document.getElementById('dOrders').innerText=s.size;document.getElementById('dSales').innerText=total.toLocaleString()+' UGX';document.getElementById('dPend').innerText=pend;document.getElementById('dashList').innerHTML=`<table class="w-full text-xs"><tbody>${html}</tbody></table>`;}if(document.getElementById('ordersTable'))document.getElementById('ordersTable').innerHTML=html||'No orders';});

if(p=='myorders'){let phone=localStorage.getItem('custPhone')||'';db.collection('ctts_orders').where('phone','==',phone).onSnapshot(s=>{let html='';s.forEach(doc=>{let o=doc.data(),id=doc.id;let itemsDisplay=o.items?o.items.map(it=>`${it.name} x${it.qty} = ${(it.qty*it.price).toLocaleString()}`).join('<br>'):o.service;html+=`<div class="border rounded-xl p-4 mb-3"><div class="flex justify-between"><span class="text-sm"><b>Items:</b><br>${itemsDisplay}</span><span class="font-bold text-sm">${Number(o.total).toLocaleString()} UGX</span></div><p class="text-xs mt-2">Status: <span class="px-2 py-1 bg-yellow-100 rounded-full text-[10px]">${o.status}</span> - ${o.progress||''}</p><p class="text-xs">Payment: <span class="${o.paid?'text-green-600':'text-red-600'} font-bold">${o.paid?'PAID':(o.paymentCode?'CODE ENTERED':'UNPAID')}</span> ${o.paymentCode?`<br><span class="bg-yellow-50 p-1 rounded text-[11px]">Code: ${o.paymentCode}</span>`:''}</p><div class="mt-3 grid grid-cols-2 gap-2"><button onclick="enterPaymentCode('${id}')" class="bg-[#ffcc00] text-black p-2 rounded-lg text-xs font-bold">Enter/Update Payment Code</button>${o.paid?`<button onclick="printReceipt('${id}')" class="bg-blue-500 text-white p-2 rounded-lg text-xs">My Receipt</button>`:''}</div></div>`;});document.getElementById('myOrdersList').innerHTML=html||'No orders';});}

qty=parseInt(qty)||1;
let existing=cart.find(c=>c.name==name);
if(existing){existing.qty+=qty;}else{cart.push({name,price,qty});}
renderCart();
}
function renderCart(){
let h='',tot=0,totalItems=0;
cart.forEach((c,i)=>{
let sub=c.price*c.qty;
tot+=sub;totalItems+=c.qty;
h+=`<div class="flex justify-between items-center py-2 border-b text-sm"><div><b>${c.name}</b><br><span class="text-xs text-gray-500">${c.price.toLocaleString()} UGX each x ${c.qty} = ${sub.toLocaleString()} UGX</span></div><div class="flex items-center gap-2"><button onclick="changeQty(${i},-1)" class="bg-gray-100 w-7 h-7 rounded-full">-</button><span class="font-bold w-6 text-center">${c.qty}</span><button onclick="changeQty(${i},1)" class="bg-gray-100 w-7 h-7 rounded-full">+</button><button onclick="removeItem(${i})" class="bg-red-50 text-red-600 w-7 h-7 rounded-full ml-1">x</button></div></div>`;
});
h+=`<div class="font-bold pt-3 flex justify-between"><span>Total (${totalItems} items):</span><span>${tot.toLocaleString()} UGX</span></div>`;
document.getElementById('cartList').innerHTML=cart.length?h:'No items';
}
function changeQty(i,delta){cart[i].qty+=delta;if(cart[i].qty<=0)cart.splice(i,1);renderCart();}
function removeItem(i){cart.splice(i,1);renderCart();}
function placeOrder(){
if(!cart.length)return alert('Add items with quantity');
let phone=localStorage.getItem('custPhone')||prompt('Phone:');
let name=localStorage.getItem('custName')||currentUser;
let tot=cart.reduce((s,c)=>s+(c.price*c.qty),0);
let method=prompt('SELECT PAYMENT:\n1 = MTN 0764316177\n2 = Airtel 0745824005\nType 1 or 2:');
let methodName=method=='1'?'MTN - 0764316177':'Airtel - 0745824005';
alert('PAY NOW:\nSend '+tot.toLocaleString()+' UGX to:\n'+methodName+'\nName: Adei Simon Peter\n\nAfter payment, enter Transaction Code');
let code=prompt('Enter TRANSACTION CODE from SMS:\nIf not paid yet, type PENDING');
if(!code)code='PENDING';
db.collection('ctts_orders').add({
name,phone,
service:cart.map(c=>`${c.name} x${c.qty}`).join(', '),
items:cart,
total:tot,
status:'pending',progress:code=='PENDING'?'Awaiting payment':'Code: '+code+' - Awaiting verify',
paid:false,paymentCode:code,paymentMethod:methodName,paymentStatus:code=='PENDING'?'UNPAID':'AWAITING_VERIFICATION',
createdAt:firebase.firestore.FieldValue.serverTimestamp()
}).then(()=>{alert('Order Placed!\nTotal: '+tot.toLocaleString()+' UGX\nCode: '+code);cart=[];document.getElementById('cartList').innerHTML='No items';showPage('myorders');});
}
function enterPaymentCode(id){let code=prompt('Enter Transaction Code:');let method=prompt('Method? 1=MTN, 2=Airtel');if(!code)return;let mName=method=='1'?'MTN':'Airtel';db.collection('ctts_orders').doc(id).update({paymentCode:code,paymentMethod:mName,paymentStatus:'AWAITING_VERIFICATION',progress:'Code: '+code+' - Awaiting verify'}).then(()=>alert('Code submitted'));}
function verifyPaymentCode(id,code){if(confirm('Verify '+code+' & Mark PAID?')){db.collection('ctts_orders').doc(id).update({paid:true,paymentStatus:'VERIFIED',status:'progress',progress:'Payment VERIFIED ('+code+') - In progress'});}}
function showPayInfo(){alert('MTN: 0764316177\nAirtel: 0745824005\nName: Adei Simon Peter\n\nAfter pay, enter code');}
function printReceipt(id){db.collection('ctts_orders').doc(id).get().then(d=>{let o=d.data(),w=window.open('','','width=800,height=600');let itemsRow=o.items?o.items.map(it=>`<tr><td>${it.name}</td><td>${it.qty}</td><td>${it.price}</td><td>${it.qty*it.price}</td></tr>`).join(''):`<tr><td>${o.service}</td><td>1</td><td>${o.total}</td><td>${o.total}</td></tr>`;w.document.write(`<html><body style="font-family:Arial;padding:20px"><h2>CTTS RECEIPT</h2><p>Adei - MTN:0764316177 | Airtel:0745824005</p><hr><p>Customer: ${o.name}<br>Phone: ${o.phone}<br>Code: ${o.paymentCode||''}<br>Method: ${o.paymentMethod||''}</p><table border=1 style="width:100%;border-collapse:collapse"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>${itemsRow}</table><h3>Total: ${o.total} UGX</h3><p>Status: ${o.paid?'PAID':o.paymentStatus}</p><script>window.print()<\/script></body></html>`);w.document.close();});}
</script></body></html>
