<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CTTS INVITE STAFF FIX</title><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5f7fb] p-4">
<div id="login" class="max-w-md mx-auto bg-white p-6 rounded-2xl mt-20 shadow">
<h1 class="font-bold text-xl">CTTS ADMIN LOGIN</h1>
<p class="text-xs text-gray-500">Use adei / 0764316177</p>
<input id="u" class="w-full border p-3 rounded-xl mt-4" placeholder="adei">
<input id="p" class="w-full border p-3 rounded-xl mt-2" placeholder="0764316177" type="password">
<button onclick="login()" class="w-full bg-black text-white p-3 rounded-xl mt-3">LOGIN</button>
<p id="err" class="hidden mt-2 text-xs text-red-600"></p>
</div>

<div id="admin" class="hidden max-w-6xl mx-auto">
<div class="flex justify-between items-center bg-[#111122] text-white p-4 rounded-2xl">
<h1 class="font-bold">CTTS ADMIN - INVITE STAFF PAGE</h1>
<button onclick="location.reload()" class="bg-white/10 px-4 py-2 rounded-full text-xs">Logout</button>
</div>

<!-- INVITE STAFF - ALWAYS VISIBLE FIRST -->
<div class="bg-white border-2 border-[#ffcc00] rounded-2xl p-6 mt-6">
<h2 class="font-bold text-lg">👔 ADMIN INVITE STAFF - THIS IS WHERE YOU INVITE</h2>
<p class="text-xs text-gray-500">Fill and click Invite - Staff can then login</p>
<div class="grid md:grid-cols-4 gap-3 mt-4">
<input id="stName" class="border p-3 rounded-xl text-sm" placeholder="Full Name e.g John Okello">
<input id="stUser" class="border p-3 rounded-xl text-sm" placeholder="Username e.g john">
<input id="stPin" class="border p-3 rounded-xl text-sm" placeholder="PIN e.g 1234">
<input id="stPhone" class="border p-3 rounded-xl text-sm" placeholder="Phone e.g 0771234567">
</div>
<button onclick="invite()" class="mt-4 w-full bg-[#ffcc00] text-black p-4 rounded-xl font-bold text-lg">➕ CLICK HERE TO INVITE STAFF</button>
<div id="msg" class="hidden mt-3 p-3 rounded-xl text-sm"></div>
</div>

<div class="grid md:grid-cols-2 gap-4 mt-6">
<div class="bg-white border rounded-2xl p-4">
<h3 class="font-bold">👥 Manage Staff - Reset PIN - Call</h3>
<div id="staffList" class="mt-3 space-y-2 text-sm">Loading...</div>
</div>
<div class="bg-white border rounded-2xl p-4">
<h3 class="font-bold">Other Admin Buttons</h3>
<div class="flex flex-wrap gap-2 mt-3">
<button onclick="showProducts()" class="bg-black text-white px-4 py-2 rounded-full text-xs">Add Stocks / Edit Price & Qty</button>
<button onclick="showCustomers()" class="bg-black text-white px-4 py-2 rounded-full text-xs">Manage Customers</button>
<button onclick="showOrders()" class="bg-black text-white px-4 py-2 rounded-full text-xs">Customer Orders + Confirm Pay</button>
<button onclick="showReset()" class="bg-yellow-100 px-4 py-2 rounded-full text-xs">Reset PIN Help</button>
</div>
<div id="other" class="mt-4"></div>
</div>
</div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyDTDSNf_na7I1NumCurymU_YTvEnGC6FtU",authDomain:"ctts-rogom-cc1e0.firebaseapp.com",projectId:"ctts-rogom-cc1e0",storageBucket:"ctts-rogom-cc1e0.firebasestorage.app",messagingSenderId:"279143059942",appId:"1:279143059942:web:cc80e0c89b01dee9fd4627"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
function login(){
 let u=document.getElementById('u').value.toLowerCase(),p=document.getElementById('p').value,e=document.getElementById('err');
 if((u=='adei'&&p=='0764316177')||(u=='admin'&&p=='0745824005')){document.getElementById('login').classList.add('hidden');document.getElementById('admin').classList.remove('hidden');loadStaff();}
 else{e.innerText='Wrong admin - use adei / 0764316177';e.classList.remove('hidden');}
}
function invite(){
 let n=document.getElementById('stName').value,us=document.getElementById('stUser').value.toLowerCase(),pin=document.getElementById('stPin').value,ph=document.getElementById('stPhone').value,box=document.getElementById('msg');
 box.classList.remove('hidden');box.className='mt-3 p-4 rounded-xl text-sm font-bold bg-red-50 text-red-600';
 if(!us||!pin){box.innerText='⚠️ Enter Username & PIN';return;}
 db.collection('staff_invites').add({name:n,username:us,pin:pin,phone:ph,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{
  box.className='mt-3 p-4 rounded-xl text-sm font-bold bg-green-50 text-green-700 border-2 border-green-200';
  box.innerHTML='✅ <b>STAFF INVITED SUCCESSFULLY!</b><br>Username: '+us+' | PIN: '+pin+' | Name: '+n+'<br>Staff can now login with Username & PIN';
  document.getElementById('stName').value='';document.getElementById('stUser').value='';document.getElementById('stPin').value='';document.getElementById('stPhone').value='';
 });
}
function loadStaff(){db.collection('staff_invites').onSnapshot(s=>{let h='';s.forEach(doc=>{let st=doc.data();h+=`<div class="border p-3 rounded-xl flex justify-between items-center"><div><b>${st.name||st.username}</b> (${st.username}) PIN: ${st.pin}<br><span class="text-xs">📞 ${st.phone||''}</span></div><div class="flex gap-1"><button onclick="resetPin('${doc.id}')" class="bg-yellow-100 px-3 py-1 rounded-full text-xs">Reset PIN</button><button onclick="db.collection('staff_invites').doc('${doc.id}').delete()" class="bg-red-100 px-3 py-1 rounded-full text-xs">Delete</button><a href="tel:${st.phone}" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs">Call</a><a href="https://wa.me/256${(st.phone||'').slice(-9)}" target="_blank" class="bg-green-500 text-white px-3 py-1 rounded-full text-xs">WhatsApp</a></div></div>`;});document.getElementById('staffList').innerHTML=h||'No staff yet - Invite above';});}
function resetPin(id){let np=prompt('New PIN');if(np)db.collection('staff_invites').doc(id).update({pin:np}).then(()=>alert('PIN Reset to '+np));}
function showProducts(){let o=document.getElementById('other');o.innerHTML=`<input id="prName" class="border p-2 rounded-xl w-full mb-2 text-sm" placeholder="Product Name"><input id="prPrice" type="number" class="border p-2 rounded-xl w-full mb-2 text-sm" placeholder="Price"><input id="prQty" type="number" class="border p-2 rounded-xl w-full mb-2 text-sm" placeholder="Quantity"><button onclick="db.collection('ctts_products').add({name:document.getElementById('prName').value,price:parseInt(document.getElementById('prPrice').value),qty:parseInt(document.getElementById('prQty').value),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>alert('Stock Added'))" class="w-full bg-black text-white p-2 rounded-xl text-sm">Add Stock</button><div id="pList" class="mt-3"></div>`;db.collection('ctts_products').onSnapshot(s=>{let h='';s.forEach(doc=>{let pr=doc.data();h+=`<div class="border p-2 rounded-xl text-xs flex justify-between"><span>${pr.name} - ${pr.price} UGX Qty:${pr.qty||0}</span><button onclick="let np=prompt('New Price',${pr.price});if(np)db.collection('ctts_products').doc('${doc.id}').update({price:parseInt(np)})" class="bg-yellow-100 px-2 py-1 rounded-full">Edit Price</button></div>`;});document.getElementById('pList').innerHTML=h;});}
function showCustomers(){let o=document.getElementById('other');db.collection('customers').onSnapshot(s=>{let h='';s.forEach(doc=>{let c=doc.data();h+=`<div class="border p-2 rounded-xl text-xs"><b>${c.name} (${c.username})</b> ${c.phone} Pass:${c.password} <div class="flex gap-1 mt-1"><button onclick="let np=prompt('New Password');if(np)db.collection('customers').doc('${doc.id}').update({password:np})" class="bg-yellow-100 px-2 py-1 rounded-full">Reset Pass</button><a href="https://wa.me/256${(c.phone||'').slice(-9)}" target="_blank" class="bg-green-500 text-white px-2 py-1 rounded-full">WhatsApp</a><a href="tel:${c.phone}" class="bg-blue-600 text-white px-2 py-1 rounded-full">Call</a></div></div>`;});o.innerHTML=`<h3 class="font-bold text-sm">Customers - View All + Reset + WhatsApp/Call</h3><div class="mt-2 space-y-2">${h}</div>`;});}
function showOrders(){let o=document.getElementById('other');db.collection('orders').orderBy('createdAt','desc').limit(20).onSnapshot(s=>{let h='';s.forEach(doc=>{let od=doc.data();h+=`<div class="border p-2 rounded-xl text-xs"><b>#${doc.id.slice(0,6)} ${od.name} ${od.total} UGX ${od.status}</b><br>Pay:${od.paymentStatus||'Unpaid'} ${od.phone}<br><button onclick="db.collection('orders').doc('${doc.id}').update({status:'Processing'})" class="bg-gray-100 px-2 py-1 rounded-full">Processing</button><button onclick="db.collection('orders').doc('${doc.id}').update({status:'Ready'})" class="bg-blue-100 px-2 py-1 rounded-full">Ready</button><button onclick="db.collection('orders').doc('${doc.id}').update({paymentStatus:'Paid'})" class="bg-green-600 text-white px-2 py-1 rounded-full">Confirm Pay</button><a href="https://wa.me/256${(od.phone||'').slice(-9)}" target="_blank" class="bg-green-500 text-white px-2 py-1 rounded-full">WhatsApp</a></div>`;});o.innerHTML=`<h3 class="font-bold text-sm">Orders - Take Action + Confirm Pay + WhatsApp</h3><div class="mt-2 space-y-2">${h||'No orders'}</div>`;});}
function showReset(){let o=document.getElementById('other');o.innerHTML=`<input id="ru" class="border p-2 rounded-xl w-full mb-2 text-sm" placeholder="Username"><input id="rp" class="border p-2 rounded-xl w-full mb-2 text-sm" placeholder="New PIN/Password"><button onclick="db.collection('customers').where('username','==',document.getElementById('ru').value.toLowerCase()).get().then(s=>{if(!s.empty)s.docs[0].ref.update({password:document.getElementById('rp').value}).then(()=>alert('Customer Reset'));})" class="bg-black text-white px-4 py-2 rounded-full text-xs">Reset Customer</button><button onclick="db.collection('staff_invites').where('username','==',document.getElementById('ru').value.toLowerCase()).get().then(s=>{if(!s.empty)s.docs[0].ref.update({pin:document.getElementById('rp').value}).then(()=>alert('Staff Reset'));})" class="bg-yellow-500 text-black px-4 py-2 rounded-full text-xs">Reset Staff</button>`;}
</script></body></html>
