}
function addProduct(){let n=document.getElementById('pName').value,pr=document.getElementById('pPrice').value,c=document.getElementById('pCat').value,d=document.getElementById('pDesc').value;if(!n||!pr)return alert('Enter name & price');db.collection('ctts_products').add({name:n,price:Number(pr),cat:c,desc:d,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Added');}
function seedProducts(){[{name:'A4 Photocopy',price:100,cat:'Photocopy',desc:'Per page'},{name:'A4 Printing',price:300,cat:'Printing',desc:'Color'},{name:'Passport Photo',price:5000,cat:'Passport Photo',desc:'4 photos'},{name:'A4 Ruled Book',price:2500,cat:'Stationery',desc:'200 pages'}].forEach(i=>db.collection('ctts_products').add({...i,createdAt:firebase.firestore.FieldValue.serverTimestamp()}));}
function delProduct(id){if(confirm('Delete?'))db.collection('ctts_products').doc(id).delete();}
function editProduct(id,oldP){let np=prompt('New Price',oldP);if(np)db.collection('ctts_products').doc(id).update({price:Number(np)});}
function addStaff(){let n=document.getElementById('sName').value,p=document.getElementById('sPhone').value,u=document.getElementById('sUser').value,ps=document.getElementById('sPass').value;if(!n||!p||!u)return alert('Fill');db.collection('ctts_staff').add({name:n,phone:p,username:u,password:ps,createdAt:firebase.firestore.FieldValue.serverTimestamp()});alert('Added');}
function delStaff(id){if(confirm('Remove?'))db.collection('ctts_staff').doc(id).delete();}
function updateStatus(id,st){let prog=prompt('Progress note:',st);db.collection('ctts_orders').doc(id).update({status:st,progress:prog||st});}
function markPaid(id){db.collection('ctts_orders').doc(id).update({paid:true,paymentStatus:'VERIFIED'});}
function delOrder(id){if(confirm('Delete?'))db.collection('ctts_orders').doc(id).delete();}
function addToCart(name,price,qty){qty=parseInt(qty)||1;let ex=cart.find(c=>c.name==name);if(ex){ex.qty+=qty;}else{cart.push({name,price,qty});}renderCart();}
function renderCart(){let h='',tot=0,items=0;cart.forEach((c,i)=>{let sub=c.price*c.qty;tot+=sub;items+=c.qty;h+=`<div class="flex justify-between items-center py-2 border-b"><div><b class="text-xs">${c.name}</b><br><span class="text-[11px] text-gray-500">${c.price.toLocaleString()} x ${c.qty} = ${sub.toLocaleString()}</span></div><div class="flex gap-1"><button onclick="changeQty(${i},-1)" class="bg-gray-100 w-7 h-7 rounded-full">-</button><span class="w-6 text-center font-bold text-xs">${c.qty}</span><button onclick="changeQty(${i},1)" class="bg-gray-100 w-7 h-7 rounded-full">+</button><button onclick="removeItem(${i})" class="bg-red-50 text-red-600 w-7 h-7 rounded-full ml-1">x</button></div></div>`;});h+=`<div class="font-bold pt-3 flex justify-between"><span>Total (${items} items):</span><span>${tot.toLocaleString()} UGX</span></div>`;document.getElementById('cartList').innerHTML=cart.length?h:'No items';}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);renderCart();}
function removeItem(i){cart.splice(i,1);renderCart();}
function placeOrder(){if(!cart.length)return alert('Add items');let phone=localStorage.getItem('custPhone')||prompt('Phone:');let name=localStorage.getItem('custName')||currentUser;let tot=cart.reduce((s,c)=>s+(c.price*c.qty),0);let method=prompt('1=MTN 0764316177, 2=Airtel 0745824005');let mName=method=='1'?'MTN - 0764316177':'Airtel - 0745824005';alert('PAY '+tot.toLocaleString()+' UGX to '+mName+'\nName: Adei');let code=prompt('Enter TRANSACTION CODE (or PENDING)');if(!code)code='PENDING';db.collection('ctts_orders').add({name,phone,service:cart.map(c=>`${c.name} x${c.qty}`).join(', '),items:cart,total:tot,status:'pending',progress:code=='PENDING'?'Awaiting payment':'Code: '+code+' - Awaiting verify',paid:false,paymentCode:code,paymentMethod:mName,paymentStatus:code=='PENDING'?'UNPAID':'AWAITING_VERIFICATION',createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{alert('Order Placed! Code: '+code);cart=[];document.getElementById('cartList').innerHTML='No items';showPage('myorders');});}
function enterPaymentCode(id){let code=prompt('Enter Transaction Code:');let method=prompt('1=MTN, 2=Airtel');if(!code)return;let mName=method=='1'?'MTN':'Airtel';db.collection('ctts_orders').doc(id).update({paymentCode:code,paymentMethod:mName,paymentStatus:'AWAITING_VERIFICATION',progress:'Code: '+code+' - Awaiting verify'}).then(()=>alert('Code submitted'));}
function verifyPaymentCode(id,code){if(confirm('Verify '+code+' & Mark PAID?')){db.collection('ctts_orders').doc(id).update({paid:true,paymentStatus:'VERIFIED',status:'progress',progress:'Payment VERIFIED ('+code+') - In progress'});}}
function showPayInfo(){alert('MTN: 0764316177\nAirtel: 0745824005\nName: Adei Simon Peter');}
function printReceipt(id){db.collection('ctts_orders').doc(id).get().then(d=>{let o=d.data(),w=window.open('','','width=800,height=600');let rows=o.items?o.items.map(it=>`<tr><td>${it.name}</td><td>${it.qty}</td><td>${it.price}</td><td>${it.qty*it.price}</td></tr>`).join(''):`<tr><td>${o.service}</td><td>1</td><td>${o.total}</td><td>${o.total}</td></tr>`;w.document.write(`<html><body style="font-family:Arial;padding:20px"><h2>CTTS RECEIPT</h2><p>Adei - MTN:0764316177 | Airtel:0745824005</p><hr><p>Customer: ${o.name}<br>Phone: ${o.phone}<br>Code: ${o.paymentCode||''}</p><table border=1 style="width:100%;border-collapse:collapse"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Subtotal</th></tr>${rows}</table><h3>Total: ${o.total} UGX</h3><p>${o.paid?'PAID':o.paymentStatus}</p><script>window.print()<\/script></body></html>`);w.document.close();});}
</script></body></html>
