<script>const firebaseConfig={apiKey:"AIzaSyDTDSNf_na7I1NumCurymU_YTvEnGC6FtU",authDomain:"ctts-rogom-cc1e0.firebaseapp.com",projectId:"ctts-rogom-cc1e0",storageBucket:"ctts-rogom-cc1e0.firebasestorage.app",messagingSenderId:"279143059942",appId:"1:279143059942:web:cc80e0c89b01dee9fd4627"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let cur='',cart=[];function addCart(n,p){if(!cur){document.getElementById('loginM').style.display='flex';return;}cart.push({n,p});upd();alert(n+' added');}function upd(){let t=0,h='';cart.forEach((x,i)=>{t+=x.p;h+=x.n+' '+x.p+' UGX <button onclick="cart.splice('+i+',1);upd()">x</button><br>'});document.getElementById('cart').innerHTML=h||'Empty';document.getElementById('tot').innerText='Total: '+t;}function reg(){let u=document.getElementById('u').value.toLowerCase(),p=document.getElementById('p').value;if(!u||!p){err.innerText='Fill all';return;}db.collection('customers').where('username','==',u).get().then(s=>{if(!s.empty){err.innerText='Exists, Login';return;}db.collection('customers').add({username:u,password:p,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>err.innerText='Registered! Now Login')})}function login(){let u=document.getElementById('u').value.toLowerCase(),p=document.getElementById('p').value;db.collection('customers').where('username','==',u).where('password','==',p).get().then(s=>{if(!s.empty){cur=u;document.getElementById('loginM').style.display='none';alert('Welcome '+u+' Now Shop works!');}else{err.innerText='Wrong, Register first'}})}function order(){if(!cur){alert('Login');return;}if(!cart.length){alert('Add item');return;}let tx=document.getElementById('tx').value;if(!tx){alert('Enter Tx');return;}let tot=cart.reduce((a,b)=>a+b.p,0);db.collection('orders').add({customerUsername:cur,items:cart,total:tot,paymentTxId:tx,status:'Pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{alert('Order Placed');cart=[];upd()})}</script></body></html>
