<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CTTS Staff Invite - Installable</title><link rel="manifest" href="manifest.json"><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f5f7fb] min-h-screen flex items-center justify-center p-4"><div class="bg-white rounded-[24px] p-6 w-full max-w-sm border shadow-xl"><img src="logo.png" class="w-14 h-14 mx-auto"><h2 class="text-center font-bold mt-3">CTTS Staff Login</h2><p class="text-center text-[11px] text-gray-500">Username set by admin - PIN 1234 first time must change - Installable App</p><input id="user" class="w-full border p-3 rounded-xl mt-4 text-sm" placeholder="Username"><input id="pin" class="w-full border p-3 rounded-xl mt-2 text-sm" placeholder="PIN 1234"><button onclick="activate()" class="w-full bg-black text-white p-3 rounded-xl mt-4 font-bold">Activate Staff - Different page from admin</button><button onclick="if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');alert('App ready - Install from menu')" class="w-full mt-2 bg-gray-100 p-2 rounded-xl text-xs">📲 Install CTTS App</button></div><script>const firebaseConfig={apiKey:"AIzaSyDTDSNf_na7I1NumCurymU_YTvEnGC6FtU",authDomain:"ctts-rogom-cc1e0.firebaseapp.com",projectId:"ctts-rogom-cc1e0",storageBucket:"ctts-rogom-cc1e0.firebasestorage.app",messagingSenderId:"279143059942",appId:"1:279143059942:web:cc80e0c89b01dee9fd4627"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let params=new URLSearchParams(location.search);document.getElementById('user').value=params.get('user')||'';document.getElementById('pin').value=params.get('pin')||'1234';function activate(){let u=document.getElementById('user').value.toLowerCase().trim(),p=document.getElementById('pin').value.trim();db.collection('staff_invites').where('username','==',u).where('pin','==',p).get().then(s=>{if(s.empty)return alert('Wrong username/PIN');let d=s.docs[0].data(),id=s.docs[0].id;localStorage.setItem('ctts_staff',d.name);localStorage.setItem('ctts_staff_user',d.username);if(d.mustChange){let np=prompt('FIRST LOGIN Default 1234 - Enter NEW PIN 4+ digits');if(!np||np.length<4)return;if(prompt('Confirm NEW PIN')!=np)return;db.collection('staff_invites').doc(id).update({pin:np,mustChange:false}).then(()=>location.href='index.html?staff=1&user='+d.username);}else location.href='index.html?staff=1&user='+d.username;});}if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
